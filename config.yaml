# =============================================================================
#  직무 공고 자동 알림 - 설정 파일
#
#  이 파일만 고치면 됩니다. 고친 뒤 저장하고 GitHub에 push 하면 바로 반영됩니다.
#  들여쓰기는 스페이스(공백)만 씁니다. 탭 문자를 쓰면 오류가 납니다.
# =============================================================================

settings:
  # 한 번 실행할 때 보낼 수 있는 최대 알림 개수. 디스코드 도배를 막는 안전장치입니다.
  max_notifications_per_run: 25

  # 맨 처음 실행할 때만 적용됩니다.
  # 처음에는 기존 공고 수백 건이 전부 "새 공고"로 잡히기 때문에,
  # 최신 N건만 보내고 나머지는 조용히 "이미 본 것"으로 처리합니다.
  first_run_limit: 10

  # 알림을 보낸 공고를 며칠 동안 기억할지. 이 기간이 지나면 기록에서 지웁니다.
  seen_retention_days: 60

  # 각 사이트에서 최신순으로 몇 페이지까지 긁어올지. 30분마다 도니까 2~3이면 충분합니다.
  max_pages: 3


# =============================================================================
#  프로필: "어떤 공고를 받을지" 묶음입니다.
#
#  - 직무를 바꾸고 싶다  -> keywords.any 를 바꾸세요
#  - 경력도 보고 싶다    -> career.max_years 숫자를 올리세요 (예: 0 -> 3)
#  - 두 직무를 동시에    -> 아래 프로필 블록을 통째로 복사해서 하나 더 만드세요
#  - 잠시 끄고 싶다      -> enabled: false
# =============================================================================

profiles:
  - name: "백엔드 신입"
    enabled: true

    # 사용할 사이트: jumpit(점핏), wanted(원티드), rallit(랠릿), jobkorea(잡코리아)
    sources: [jumpit, wanted, rallit, jobkorea]

    keywords:
      # any: 이 중 하나라도 제목/기술스택/직무분류에 들어있으면 통과합니다.
      #      (비워두면 키워드 조건 없이 전부 통과)
      any:
        - "백엔드"
        - "backend"
        - "back-end"
        - "서버 개발"
        - "서버개발"
        - "Spring"
        - "Django"
        - "Node.js"
        - "NestJS"
        - "FastAPI"

      # all: 여기 적은 단어가 "전부" 들어있어야 통과합니다. 보통은 비워둡니다.
      all: []

      # none: 이 중 하나라도 들어있으면 무조건 제외합니다.
      # any 가 기술스택에도 걸리기 때문에, "Node.js" 같은 단어 하나로
      # 프론트엔드/풀스택 공고까지 딸려옵니다. 아래 목록이 그걸 걸러줍니다.
      none:
        - "인턴"
        - "계약직"
        - "프리랜서"
        - "파견"
        - "프론트엔드"
        - "frontend"
        - "front-end"
        - "퍼블리셔"
        # 잡코리아에 많은 국비지원 학원 광고를 걸러냅니다
        - "국비"
        - "부트캠프"
        - "아카데미"
        - "교육생"
        - "훈련생"

    career:
      # 내가 지원 가능한 경력 구간(년). 공고의 요구 경력 구간과 겹치면 알림이 옵니다.
      #
      #   신입만 보고 싶다      -> min_years: 0,  max_years: 0
      #   3년차까지 보고 싶다   -> min_years: 0,  max_years: 3
      #   3~7년 경력만 보고 싶다 -> min_years: 3,  max_years: 7
      min_years: 0
      max_years: 0

      # "경력무관" 이거나 경력 정보가 아예 없는 공고도 받을지 여부
      include_irrelevant: true

    # 근무지. 비워두면([]) 전국 전체를 받습니다.
    locations: ["서울", "경기", "인천"]

    # 알림 받고 싶지 않은 회사 이름 (부분 일치)
    exclude_companies: []

    # 잡코리아는 검색어 기반 사이트라 이 단어들로 검색합니다.
    # 비워두면 위 keywords.any 의 앞 3개를 자동으로 씁니다.
    search_queries: ["백엔드", "서버 개발자"]

    # 알림을 보낼 디스코드 웹훅이 담긴 환경변수 이름입니다.
    # 프로필마다 다른 채널로 보내고 싶으면 DISCORD_WEBHOOK_FRONTEND 처럼
    # 다른 이름을 적고, GitHub Secrets 에도 같은 이름으로 등록하세요.
    webhook_env: DISCORD_WEBHOOK_URL


  # ---------------------------------------------------------------------------
  # 아래는 "나중에 이렇게 바꾸면 된다"는 예시입니다. enabled: false 라 지금은 꺼져 있습니다.
  # 경력직도 보고 싶어지면 enabled: true 로만 바꾸면 됩니다.
  # ---------------------------------------------------------------------------
  - name: "백엔드 경력 3년까지"
    enabled: false
    sources: [jumpit, wanted, rallit]
    keywords:
      any: ["백엔드", "backend", "서버 개발", "Spring", "Django", "Node.js"]
      all: []
      none: ["인턴", "계약직"]
    career:
      min_years: 0
      max_years: 3
      include_irrelevant: true
    locations: ["서울", "경기"]
    exclude_companies: []
    search_queries: []
    webhook_env: DISCORD_WEBHOOK_URL
