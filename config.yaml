      any:
        # --- 백엔드 ---
        - "백엔드"
        - "backend"
        - "back-end"
        - "서버 개발"
        - "서버개발"
        - "서버 엔지니어"
        - "API 개발"
        # --- 웹 ---
        - "웹 개발"
        - "웹개발"
        - "웹 서비스"
        - "웹서비스"
        - "풀스택"
        - "fullstack"
        - "full stack"
        # --- Java 계열 ---
        - "Java"
        - "자바"
        - "Kotlin"
        - "코틀린"
        - "Spring"
        - "스프링"
        - "JSP"
        - "JPA"
        - "MyBatis"
        # --- AI Native ---
        # AI 를 '도구로 활용해' 개발하는 직무만 받습니다.
        # AI 자체를 만드는 직무(ML/LLM/딥러닝 연구)는 아래 none 에서 걸러냅니다.
        - "AI Native"
        - "AI-Native"
        - "AI 네이티브"
        - "AI 활용"

      all: []

      none:
        # 고용형태 — '인턴' 은 일부러 넣지 않습니다 (전환형 인턴을 받기 위해)
        - "계약직"
        - "프리랜서"
        - "파견"
        - "아르바이트"
        - "체험형"
        - "연수생"
        - "교육생"
        - "훈련생"
        # 원하는 직무가 아닌 것
        - "프론트엔드"
        - "frontend"
        - "front-end"
        # '프론트엔드' 만으로는 "프론트엔지니어 개발자" 가 안 걸립니다
        - "프론트엔지니어"
        - "퍼블리셔"
        - "안드로이드"
        - "android"
        - "ios"
        - "QA"
        - "테스터"
        # 개발이 아닌 직군.
        # "커리큘럼 기획 매니저 [AI 엔지니어링 교육]" 처럼 제목에 AI·엔지니어가
        # 들어가지만 개발자를 뽑는 게 아닌 공고를 걸러냅니다.
        - "매니저"
        - "기획"
        - "프로듀서"
        - "커리큘럼"
        - "컨설턴트"
        - "강사"
        - "멘토"
        - "마케팅"
        - "디자이너"
        - "designer"
        # AI 를 '만드는' 직무는 제외합니다. (AI 를 활용해 개발하는 직무만 원함)
        - "머신러닝"
        - "딥러닝"
        - "MLOps"
        - "ML Engineer"
        - "ML 엔지니어"
        - "AI 엔지니어"
        - "AI 개발자"
        - "AI개발자"
        - "AI 리서치"
        - "리서치 엔지니어"
        - "Research Engineer"
        - "데이터 사이언"
        - "데이터사이언"
        - "NLP"
        - "컴퓨터 비전"
        - "컴퓨터비전"
        - "생성형 AI"
        # 임베디드·펌웨어·빅데이터 직무.
        # 회사가 직무분류에 '서버/백엔드' 를 같이 적어두거나 기술스택에 Java, Spring 이
        # 들어 있어서 걸려 들어옵니다. 제목·스택으로 걸러냅니다.
        - "펌웨어"
        - "임베디드"
        - "MCU"
        - "BSW"
        - "ASW"
        - "빅데이터"
        # 채용공고가 아닌 학원 광고
        - "국비"
        - "부트캠프"
        - "아카데미"

    career:
      # 경력무관 또는 "0~N년", "1~N년" 처럼 0~1년차부터 지원 가능한 공고만 받습니다.
      #   통과: 신입 / 신입~3년 / 1~5년 / 경력무관
      #   제외: 2년 이상 / 3~8년
      min_years: 0
      max_years: 1
      include_irrelevant: true

    locations: ["서울", "경기", "인천"]
    include_companies: []
    exclude_companies: []

    # 잡코리아는 검색어 기반이라 이 단어들로 검색합니다. (검색어 1개 = 요청 1회)
    search_queries: ["백엔드", "Java 개발자", "웹 개발자"]

    webhook_env: DISCORD_WEBHOOK_URL


