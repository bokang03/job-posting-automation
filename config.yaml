# =============================================================================
#  직무 공고 자동 알림 - 설정 파일
#
#  이 파일만 고치면 됩니다. 저장하면 다음 실행(30분 이내)부터 반영됩니다.
#  들여쓰기는 스페이스(공백)만 씁니다. 탭 문자를 쓰면 오류가 납니다.
#
#  고친 뒤에는 preview.bat 을 눌러 어떤 공고가 걸리는지 먼저 확인하세요.
# =============================================================================

settings:
  # 한 번 실행할 때 보낼 수 있는 최대 알림 개수. 디스코드 도배를 막는 안전장치입니다.
  max_notifications_per_run: 25

  # 맨 처음 실행할 때만 적용됩니다. 최신 N건만 보내고 나머지는 조용히 처리합니다.
  first_run_limit: 10

  # 알림을 보낸 공고를 며칠 동안 기억할지. 이 기간이 지나면 기록에서 지웁니다.
  seen_retention_days: 60

  # 각 사이트에서 최신순으로 몇 페이지까지 긁어올지.
  #
  # 3 으로 뒀더니 원티드 300건까지만 봐서, 9페이지에 있던 넥슨게임즈 공고를
  # 통째로 놓치고 있었습니다. 넉넉하게 잡습니다.
  # (원티드 100건/페이지, 랠릿 50건/페이지, 점핏 16건/페이지)
  max_pages: 10

  # 한 실행에서 잡코리아에 검색할 화이트리스트 회사 수.
  #
  # 잡코리아는 검색어 기반이라 검색하지 않은 회사의 공고는 절대 안 잡힙니다.
  # 화이트리스트가 90곳인데 한 번에 다 검색하면 요청이 90번이라 연결이 끊깁니다.
  # 그래서 매 실행마다 8곳씩 옮겨가며 검색해, 약 6시간이면 전체를 한 바퀴 돕니다.
  company_queries_per_run: 8

  # 잡코리아는 고용형태(정규직/인턴/연수생)를 검색 목록에 주지 않아서,
  # 알림 직전에 공고 상세 페이지를 한 번 열어 확인합니다.
  # 조건을 통과했고 아직 안 보낸 공고만 열어보므로 평소에는 몇 건 되지 않습니다.
  max_enrich_per_run: 15

  # 새 공고가 없을 때 "살아있다"는 상태 메시지를 보낼 간격(시간).
  #
  # 매 실행마다 보내면 30분마다 하루 48번이라 알림 채널을 못 쓰게 됩니다.
  # 그래서 '조용한 상태가 이 시간만큼 이어질 때만' 한 번 보냅니다.
  # 공고 알림이 나간 실행은 그 자체로 살아있다는 증거라 상태 메시지를 보내지 않습니다.
  # 사이트 수집에 실패한 경우에는 조치가 필요하므로 1시간 간격으로 더 빨리 알립니다.
  #
  #   6   = 6시간 조용하면 한 번 (기본, 하루 최대 4번)
  #   12  = 하루 최대 2번
  #   0   = 상태 메시지를 아예 받지 않음
  heartbeat_hours: 6


# =============================================================================
#  고용형태에 대하여
#
#  "정규직 + 전환형 인턴" 을 받고 싶다는 요구를 이렇게 처리했습니다.
#
#  none 목록에서 '인턴' 을 뺐습니다. '인턴' 을 넣으면 채용전환형 인턴까지
#  함께 걸러지기 때문입니다. 대신 확실히 아닌 것들만 제외합니다.
#    계약직 / 파견 / 프리랜서 / 아르바이트 / 체험형 / 연수생 / 교육생
#
#  잡코리아 공고는 상세 페이지에서 고용형태를 읽어오므로
#  디스코드 카드에 "고용형태: 인턴, 정규직 전환" 처럼 표시됩니다.
#  전환형인지 아닌지 카드만 보고 판단하실 수 있습니다.
# =============================================================================

profiles:
