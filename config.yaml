# =============================================================================
#  직무 공고 자동 알림 - 설정 파일
#
#  이 파일만 고치면 됩니다. 고친 뒤 저장하고 GitHub에 push 하면 바로 반영됩니다.
#  들여쓰기는 스페이스(공백)만 씁니다. 탭 문자를 쓰면 오류가 납니다.
# =============================================================================

settings:
  # 한 번 실행할 때 보낼 수 있는 최대 알림 개수. 디스코드 도배를 막는 안전장치입니다.
  max_notifications_per_run: 25

  # 맨 처음 실행할 때만 적용됩니다.
  # 처음에는 기존 공고 수백 건이 전부 "새 공고"로 잡히기 때문에,
  # 최신 N건만 보내고 나머지는 조용히 "이미 본 것"으로 처리합니다.
  first_run_limit: 10

  # 알림을 보낸 공고를 며칠 동안 기억할지. 이 기간이 지나면 기록에서 지웁니다.
  seen_retention_days: 60

  # 각 사이트에서 최신순으로 몇 페이지까지 긁어올지. 30분마다 도니까 2~3이면 충분합니다.
  max_pages: 3

  # 잡코리아는 고용형태(정규직/인턴/연수생·교육생)를 검색 목록에 주지 않아서,
  # 알림을 보내기 직전에 공고 상세 페이지를 한 번 열어 확인합니다.
  # 조건을 통과했고 아직 안 보낸 공고만 열어보므로 평소에는 몇 건 되지 않습니다.
  # 이 값은 설정을 크게 바꿨을 때 요청이 폭증하지 않도록 두는 상한입니다.
  # 잡코리아가 요청이 많으면 연결을 끊어버려서 넉넉하게 잡지 않습니다.
  max_enrich_per_run: 15


# =============================================================================
#  프로필이 두 개인 이유
#
#  점핏과 랠릿은 공고마다 기술스택(Java, Kotlin, Spring...)을 알려줍니다.
#  그래서 "언어가 Java 또는 Kotlin" 을 확실하게 조건으로 걸 수 있습니다.
#
#  반면 원티드와 잡코리아는 기술스택을 주지 않습니다. 제목만 보고 판단해야 하는데,
#  실제로 원티드 공고 300건 중 제목에 Java/Kotlin/Spring 이 들어간 건 4건뿐이었습니다.
#  여기에 같은 조건을 걸면 두 사이트가 통째로 침묵합니다.
#
#  그래서 사이트를 성격별로 나눠 두 프로필로 운영합니다.
#    1번: 점핏/랠릿  -> Java·Kotlin 을 필수 조건으로 (정확도 우선)
#    2번: 원티드/잡코리아 -> 직무 키워드로 (놓치지 않기 우선)
#
#  두 프로필 모두 같은 디스코드 채널로 갑니다. 같은 공고가 두 번 오지는 않습니다.
# =============================================================================

profiles:
  # ---------------------------------------------------------------------------
  # 1. 점핏 · 랠릿 — 기술스택으로 Java/Kotlin 을 정확히 걸러냅니다
  # ---------------------------------------------------------------------------
  - name: "Java·Kotlin 백엔드"
    enabled: true
    sources: [jumpit, rallit]

    keywords:
      # all 의 각 줄은 "이 조건은 반드시" 이고, 줄 안의 목록은 "이 중 하나라도" 입니다.
      all:
        # (1) 직무가 백엔드/서버/웹 계열이어야 하고
        #     여기에 Java, Kotlin 을 넣으면 안 됩니다. (2)번과 겹쳐서
        #     직무 조건이 무력화되고 앱·프론트 공고까지 통과하게 됩니다.
        #     JSP/JPA/MyBatis 는 Java 백엔드에서만 쓰이는 기술이라 직무 판단에 넣어도 안전합니다.
        #     ("JAVA 주니어 채용" 처럼 제목에 직무가 안 적힌 공고를 여기서 건집니다)
        - ["백엔드", "backend", "back-end", "서버", "server",
           "웹 개발", "웹개발", "웹 서비스", "웹서비스",
           "풀스택", "fullstack", "full stack",
           "Spring", "JSP", "JPA", "MyBatis", "Servlet",
           "API 개발", "플랫폼 개발"]
        # (2) 동시에 언어가 Java 또는 Kotlin 이어야 합니다  ← 가장 중요한 조건
        - ["Java", "Kotlin"]

      any: []

      none:
        # 정규직만 받기
        - "인턴"
        - "계약직"
        - "프리랜서"
        - "파견"
        - "아르바이트"
        - "체험형"
        # Java/Kotlin 을 쓰지만 원하는 직무가 아닌 것 걸러내기
        - "안드로이드"
        - "android"
        - "앱 개발"
        - "React Native"
        - "프론트엔드"
        - "frontend"
        - "front-end"
        - "프론트엔지니어"
        - "퍼블리셔"
        - "QA"
        - "테스터"
        - "라벨"
        - "labeler"
        # 채용공고가 아닌 학원 광고
        - "국비"
        - "부트캠프"
        - "아카데미"
        - "교육생"
        - "연수생"
        - "훈련생"

    career:
      # 경력무관 / 신입 중심.
      # max_years: 1 이면 "신입~7년", "신입~8년", "1~3년" 처럼 1년 이하가 포함된 구간은 통과하고,
      # "2년 이상", "3~8년" 처럼 신입이 지원할 수 없는 공고는 걸러집니다.
      min_years: 0
      max_years: 1
      include_irrelevant: true

    locations: ["서울", "경기", "인천"]
    include_companies: []
    exclude_companies: []
    search_queries: []
    webhook_env: DISCORD_WEBHOOK_URL


  # ---------------------------------------------------------------------------
  # 2. 원티드 · 잡코리아 — 기술스택 정보가 없어 직무 키워드로 찾습니다
  # ---------------------------------------------------------------------------
  - name: "백엔드·웹 (원티드/잡코리아)"
    enabled: true
    sources: [wanted, jobkorea]

    keywords:
      # 이 중 하나라도 제목/직무분류에 있으면 통과
      any:
        - "백엔드"
        - "backend"
        - "back-end"
        - "서버 개발"
        - "서버개발"
        - "웹 개발"
        - "웹개발"
        - "Java"
        - "자바"
        - "Kotlin"
        - "코틀린"
        - "Spring"
        - "스프링"

      all: []

      none:
        # 정규직만 받기 (원티드는 고용형태를 알려주므로 여기서 정확히 걸러집니다)
        - "인턴"
        - "계약직"
        - "프리랜서"
        - "파견"
        - "아르바이트"
        - "체험형"
        # 원하는 직무가 아닌 것
        - "안드로이드"
        - "android"
        - "프론트엔드"
        - "frontend"
        - "front-end"
        - "퍼블리셔"
        - "QA"
        - "테스터"
        # 학원 광고
        - "국비"
        - "부트캠프"
        - "아카데미"
        - "교육생"
        - "연수생"
        - "훈련생"

    career:
      min_years: 0
      max_years: 1
      include_irrelevant: true

    locations: ["서울", "경기", "인천"]
    include_companies: []
    exclude_companies: []

    # 잡코리아는 검색어 기반 사이트라 이 단어들로 검색합니다.
    search_queries: ["백엔드", "Java 개발자", "웹 개발자"]

    webhook_env: DISCORD_WEBHOOK_URL


  # ---------------------------------------------------------------------------
  # 3. 대기업 · 금융권 — 이 회사들이면 IT 직무 전부 받습니다
  #
  #    include_companies 에 적힌 회사의 공고만 통과시킵니다.
