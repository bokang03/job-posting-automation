    # 잡코리아는 검색어 기반이라, 검색하지 않은 회사의 공고는 아무리 기다려도
    # 안 잡힙니다. 실제로 넥슨 공고가 이 때문에 통째로 누락되고 있었습니다.
    # 한 실행에 8곳씩(settings.company_queries_per_run) 옮겨가며 검색해
    # 몇 시간이면 명단 전체를 한 바퀴 돕니다.
    search_companies: true

    search_queries:
      - "은행 IT"
      - "금융 개발자"

    webhook_env: DISCORD_WEBHOOK_URL


# =============================================================================
#  자주 바꾸는 것들
#
#  경력 범위를 넓히고 싶다   -> career.max_years 를 3, 5 등으로
#  직무를 바꾸고 싶다        -> 1번 프로필 keywords.any 를 교체
#  인턴을 아예 빼고 싶다     -> 양쪽 none 에 "인턴" 추가
#  전국으로 넓히고 싶다      -> locations: []
#  프로필 하나만 쓰고 싶다   -> 안 쓸 프로필에 enabled: false
# =============================================================================
