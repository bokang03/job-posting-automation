name: 직무 공고 알림

# =============================================================================
#  예약 실행은 꺼져 있습니다. 지금은 내 PC 의 작업 스케줄러가 대신 돌립니다.
#
#  이유: GitHub 러너는 미국에 있는데 잡코리아와 원티드가 해외 IP 를 막습니다.
#        실제 실행 로그에서 확인한 증상입니다.
#          [jobkorea] ConnectTimeoutError (connect timeout=20)
#          [wanted]   403 Client Error: Forbidden
#          [jumpit]   48건 수집   정상
#          [rallit]   150건 수집  정상
#        같은 코드가 한국 IP 에서는 넷 다 정상입니다.
#
#  되살리려면 아래 schedule 두 줄의 주석(#)을 풀면 됩니다.
#  단 그때는 점핏과 랠릿만 동작하고, 내 PC 의 기록과 어긋나
#  같은 공고가 두 번 올 수 있습니다. 한쪽만 켜세요.
# =============================================================================

on:
  # schedule:
  #   - cron: "*/30 * * * *"

  # Actions 탭에서 손으로 실행할 때만 동작합니다.
  workflow_dispatch:

# 동시에 두 번 돌면서 state 를 서로 덮어쓰는 것을 막습니다.
concurrency:
  group: job-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공고 수집 및 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: 알림 기록 저장
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "새로 보낸 공고가 없어 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: 알림 보낸 공고 기록 갱신"
          # 다른 실행이 먼저 push 했을 수 있으니 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "state 커밋에 실패했습니다. 다음 실행에서 같은 공고가 한 번 더 올 수 있습니다."
          exit 1
