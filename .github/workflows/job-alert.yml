name: 직무 공고 알림

on:
  schedule:
    # 30분마다 실행 (UTC 기준이지만 30분 주기라 시간대와 무관)
    # GitHub 사정에 따라 몇 분 늦게 실행될 수 있습니다. 정상입니다.
    - cron: "*/30 * * * *"
  # Actions 탭에서 손으로 즉시 실행할 때 사용
  workflow_dispatch:

# 동시에 두 번 돌면서 state 를 서로 덮어쓰는 것을 막습니다.
concurrency:
  group: job-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공고 수집 및 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: 알림 기록 저장
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "새로 보낸 공고가 없어 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: 알림 보낸 공고 기록 갱신"
          # 다른 실행이 먼저 push 했을 수 있으니 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "state 커밋에 실패했습니다. 다음 실행에서 같은 공고가 한 번 더 올 수 있습니다."
          exit 1
